name: Deploy

# Manual trigger only. Run "setup" once on a fresh droplet (installs Docker,
# boots Postgres), then "deploy" for every release. Run "proxy reboot -y" when
# deploy reports kamal-proxy is too old after a Kamal upgrade.
# Required repo secrets: SSH_PRIVATE_KEY, DEPLOY_HOST, SECRET_KEY_BASE, POSTGRES_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      command:
        description: Kamal command
        type: choice
        options: [deploy, setup, "proxy reboot -y"]
        default: deploy

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run Kamal
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: bundle exec kamal ${{ inputs.command }}
