service: predium

image: aliciapaz/predium

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    options:
      memory: 1g

proxy:
  ssl: true
  host: app.prediumapp.org

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "1"
    SOLID_QUEUE_IN_PUMA: "1"
    DB_HOST: predium-db
    R2_BUCKET: predium-production
  secret:
    - SECRET_KEY_BASE
    - PREDIUM_DATABASE_PASSWORD:POSTGRES_PASSWORD
    - R2_ACCOUNT_ID
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY

volumes:
  - "predium_storage:/rails/storage"

asset_path: /rails/public/assets

readiness_delay: 5

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: predium_production
        POSTGRES_USER: predium
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
