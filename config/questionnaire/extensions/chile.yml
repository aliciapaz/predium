# Chile Territory Extension: Level 2 indicators
# Ported from prediapp Form::LEVEL_TWO_ENTRIES_BY_DIMENSION.
# The mapping of each indicator to a core dimension is PROVISIONAL, pending
# review by an agroecology specialist (see plan Appendix A). Keys are permanent
# response identifiers; four prediapp typos were normalized at port time
# (compactation->compaction, traiditional_crops_seeds->traditional_crops_seeds,
# food_convervation->food_conservation, infected_plants_remotion->infected_plants_removal).
# The seven north-only / south-only water questions are excluded here; they will
# arrive later as chile-norte / chile-sur extensions.

