# Predium v2 — Core Questionnaire Configuration
# Level 1: 6 agroecology principles, answered directly (the L1 score).
# Level 2: 6 categories grouping 14 dimensions. Indicators live in territory
# extensions (config/questionnaire/extensions/*.yml), not here.
# See docs/architecture.md ADR-2.

principles:
  - key: biodiversity
    i18n_key: questionnaire.principles.biodiversity
    position: 1
  - key: recycling
    i18n_key: questionnaire.principles.recycling
    position: 2
  - key: interactions
    i18n_key: questionnaire.principles.interactions
    position: 3
  - key: soil_management
    i18n_key: questionnaire.principles.soil_management
    position: 4
  - key: pest_management
    i18n_key: questionnaire.principles.pest_management
    position: 5
  - key: traditional_knowledge
    i18n_key: questionnaire.principles.traditional_knowledge
    position: 6

categories:
  # ── Soil ──────────────────────────────────────────────────
  - key: soil
    i18n_key: questionnaire.categories.soil
    position: 1
    dimensions:
      - key: soil_health
        i18n_key: questionnaire.dimensions.soil_health
      - key: soil_management
        i18n_key: questionnaire.dimensions.soil_management

  # ── Water ─────────────────────────────────────────────────
  - key: water
    i18n_key: questionnaire.categories.water
    position: 2
    dimensions:
      - key: water_availability
        i18n_key: questionnaire.dimensions.water_availability
      - key: water_quality
        i18n_key: questionnaire.dimensions.water_quality
      - key: water_management
        i18n_key: questionnaire.dimensions.water_management

  # ── Biodiversity ──────────────────────────────────────────
  - key: biodiversity
    i18n_key: questionnaire.categories.biodiversity
    position: 3
    dimensions:
      - key: crop_diversity
        i18n_key: questionnaire.dimensions.crop_diversity
      - key: ecosystem_diversity
        i18n_key: questionnaire.dimensions.ecosystem_diversity

  # ── Management ────────────────────────────────────────────
  - key: management
    i18n_key: questionnaire.categories.management
    position: 4
    dimensions:
      - key: farm_planning
        i18n_key: questionnaire.dimensions.farm_planning
      - key: input_management
        i18n_key: questionnaire.dimensions.input_management
      - key: animal_management
        i18n_key: questionnaire.dimensions.animal_management

  # ── Socioeconomic ─────────────────────────────────────────
  - key: socioeconomic
    i18n_key: questionnaire.categories.socioeconomic
    position: 5
    dimensions:
      - key: economic_viability
        i18n_key: questionnaire.dimensions.economic_viability
      - key: social_wellbeing
        i18n_key: questionnaire.dimensions.social_wellbeing

  # ── Resilience ────────────────────────────────────────────
  - key: resilience
    i18n_key: questionnaire.categories.resilience
    position: 6
    dimensions:
      - key: climate_adaptation
        i18n_key: questionnaire.dimensions.climate_adaptation
      - key: system_resilience
        i18n_key: questionnaire.dimensions.system_resilience
