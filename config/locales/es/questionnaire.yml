es:
  questionnaire:
    # ── Principios L1 (agroecologicos, respuesta directa) ──
    principles:
      biodiversity:
        name: "Biodiversidad"
        scoring:
          low: "Escasa diversidad general en el predio."
          medium: "Mediana diversidad general en el predio."
          high: "Máxima diversidad en el predio."
      recycling:
        name: "Reciclaje"
        scoring:
          low: "No existen prácticas de reciclaje habituales."
          medium: "Reciclaje parcial en algunos sectores del predio."
          high: "Elevado porcentaje de recursos naturales del predio se reciclan por distintos mecanismos."
      interactions:
        name: "Nivel de interacción entre los componentes del sistema: animal, agrícola, forestal, otros"
        chart_label: "Interacciones del sistema"
        scoring:
          low: "No están presentes todos los componentes y no se observan interacciones claras."
          medium: "Existen todos los componentes, pero sin un diseño que los haga interactuar de forma clara. Interacciones parciales."
          high: "Están todos los componentes dentro de un diseño que establece interacciones concretas y beneficiosas."
      soil_management:
        name: "Manejo ecológico del suelo"
        chart_label: "Manejo del suelo"
        scoring:
          low: "No existen prácticas de conservación de suelo ni adiciones sistemáticas de materia orgánica."
          medium: "Existen practicas limitadas de conservación de suelo y aplicaciones esporádicas de materia orgánica."
          high: "Existe estructura definidas de protección y conservación de suelo y aplicaciones permanentes de materia orgánica."
      pest_management:
        name: "Manejo ecológico de plagas y enfermedades"
        chart_label: "Plagas y enfermedades"
        scoring:
          low: "No existen prácticas ecológicas de manejo y control."
          medium: "Existe un nivel medio de prácticas ecológicas de control y en ocasiones se usan pesticidas de forma combinada."
          high: "El control de plagas se basa completamente en base a una estrategia agroecológica."
      traditional_knowledge:
        name: "Bases culturales y conocimiento tradicional en el manejo del sistema"
        chart_label: "Conocimiento tradicional"
        scoring:
          low: "No existen prácticas tradicionales identificables en el sistema."
          medium: "Existe un nivel mediano de prácticas tradicionales que se corresponde con principios agroecológicos."
          high: "Las prácticas tradicionales son relevantes en el manejo del predio y son la base de la estrategia productiva."

    # ── Categorias L1 ─────────────────────────────────────
    categories:
      soil: "Suelo"
      water: "Agua"
      biodiversity: "Biodiversidad"
      management: "Manejo"
      socioeconomic: "Socioeconómico"
      resilience: "Resiliencia"

    # ── Dimensiones ───────────────────────────────────────
    dimensions:
      soil_health: "Salud del suelo"
      soil_management: "Manejo del suelo"
      water_availability: "Disponibilidad de agua"
      water_quality: "Calidad del agua"
      water_management: "Gestión del agua"
      crop_diversity: "Diversidad de cultivos"
      ecosystem_diversity: "Diversidad del ecosistema"
      farm_planning: "Planificación del predio"
      input_management: "Gestión de insumos"
      animal_management: "Manejo animal"
      economic_viability: "Viabilidad económica"
      social_wellbeing: "Bienestar social"
      climate_adaptation: "Adaptación climática"
      system_resilience: "Resiliencia del sistema"

    # ── Indicadores L2 (extension Chile; nombre y pistas por rango de puntaje) ──
    indicators:
      # soil_health
      soil_coverage:
        name: "Cobertura de suelo"
        scoring:
          low: "Suelo desnudo <20% de cobertura."
          medium: "Suelo cubierto hasta un 60% por residuos, hojarasca o cubierta viva."
          high: "Más del 80% del suelo con cobertura viva o muerta."
      soil_erosion:
        name: "Erosión de suelo"
        scoring:
          low: "Erosión severa, se nota arrastre de suelo y presencia de cárcavas y canalillos."
          medium: "Erosión evidente pero todavía de baja o media magnitud."
          high: "No hay signos de erosión."
      compaction:
        name: "Compactación"
        scoring:
          low: "Compacto, es muy difícil penetrar con una barra metálica."
          medium: "Una barra metálica penetra con dificultad y solo hasta una cierta profundidad."
          high: "Suelo esponjoso, no compacto, se puede penetrar con facilidad."
      infiltration:
        name: "Infiltración"
        scoring:
          low: "Agua infiltra muy lentamente."
          medium: "Agua infiltra con velocidad media."
          high: "Agua infiltra fácilmente."
      soil_depth:
        name: "Profundidad efectiva de suelo"
        scoring:
          low: "Subsuelo casi expuesto. (Profundidad efectiva <10cm)"
          medium: "Suelo delgado. (Profundidad efectiva entre 10 y 30cm)"
          high: "Suelo profundo. (Profundidad efectiva > 40cm)"
      soil_structure:
        name: "Estructura de suelo"
        scoring:
          low: "Suelo polvoriento, se rompe sin gránulos visibles."
          medium: "Suelo suelto, con pocos gránulos que se rompen al aplicar presión suave."
          high: "Suelo friable y granular, agregados mantienen formas después de aplicar presión suave."
      clod_stability:
        name: "Estabilidad del terrón"
        scoring:
          low: "Terrón se deshace rápidamente al exponerlo al agua."
          medium: "Terrón resiste medianamente al exponerlo al agua."
          high: "Terrón mantiene su forma al exponerlo al agua."
      color_and_smell:
        name: "Color y olor"
        scoring:
          low: "Suelo de color pálido o con mal olor o químico."
          medium: "Suelo de color café claro o rojizo, sin mayor olor."
          high: "Suelo de color negro o café oscuro, con olor a tierra fresca."
      root_development:
        name: "Desarrollo de raíces"
        scoring:
          low: "Raíces poco desarrolladas, enfermas y cortas."
          medium: "Raíces de crecimiento limitado, se ven raíces finas en mediana cantidad."
          high: "Raíces finas y gruesas con buen crecimiento, saludables y profundas."
      residue_condition:
        name: "Estado de residuos"
        scoring:
          low: "Residuos orgánicos presentes que no se descomponen o muy lentamente."
          medium: "Aún persiste residuo del año pasado en vías de descomposición."
          high: "Residuos en varios estados de descomposición, con una gran proporción ya incorporados al suelo."
      biological_activity:
        name: "Actividad biológica"
        scoring:
          low: "Sin signos de actividad biológica ni individuos presentes (lombrices, artrópodos, etc.)."
          medium: "Con signos de actividad biológica, algunas lombrices y artrópodos presentes."
          high: "Mucha actividad biológica, abundantes lombrices y artrópodos presentes."
      organic_matter:
        name: "Materia orgánica"
        scoring:
          low: "Signos débiles de presencia de materia orgánica, baja reacción al agua oxigenada."
          medium: "Presencia de materia orgánica, mediana reacción al agua oxigenada."
          high: "Abundante presencia de materia orgánica, alta reacción al agua oxigenada."
      # soil_management
      crop_rotation:
        name: "Rotaciones"
        scoring:
          low: "No rota sus cultivos."
          medium: "Algunos cultivos en rotación."
          high: "Todos los cultivos están incorporados en un sistema de rotación."
      organic_fertilizers:
        name: "Incorporación de abonos orgánicos"
        scoring:
          low: "No elabora ni usa abonos orgánicos, solo químicos."
          medium: "Superficie de terreno con incorporaciones de abonos orgánicos en el año equivale a un 25 a 65%, con escasas aplicaciones de químicos."
          high: "Alta superficie de terreno con incorporaciones de abonos orgánicos en el año, sin utilización de químicos."
      leaf_fertilizers:
        name: "Abonos orgánicos foliares y a través de fertirriego"
        scoring:
          low: "No elabora ni usa abonos orgánicos foliares."
          medium: "Cultivos o frutales con incorporaciones de abonos orgánicos foliares en el año equivale a un 25 a 65%."
          high: "Alta superficie de cultivos o frutales con incorporaciones de abonos orgánicos foliares en el año."
      efficient_microorganisms:
        name: "Microorganismos eficientes"
        scoring:
          low: "No utiliza microorganismos eficientes."
          medium: "Utiliza algunas aplicaciones foliares y al suelo de microorganismos eficientes."
          high: "Muchas aplicaciones foliares y al suelo de microorganismos eficientes."
      soil_conservation:
        name: "Confección de obras de conservación de suelo"
        scoring:
          low: "Suelo sin obras y/o manejos de conservación de suelo."
          medium: "Algunas áreas de superficie de terrenos en pendiente con obras de conservación (curvas a nivel, zanjas de infiltración, etc.)."
          high: "Todas las áreas de superficie de terrenos en pendiente con obras de conservación (curvas a nivel, zanjas de infiltración, etc.)."
      stubble_burning:
        name: "Eliminación de quemas"
        scoring:
          low: "Utiliza la práctica de quema de rastrojos."
          medium: "Ha reducido la práctica de quema de rastrojos."
          high: "Ha eliminado completamente las prácticas de quema de rastrojos."
      weed_management:
        name: "Prácticas de manejo de malezas (mulch, desbrozadora, rana, cultivos de cobertura, etc.)"
        scoring:
          low: "Manejo de malezas en base a herbicidas químicos."
          medium: "Incorpora algunas medidas de manejo de malezas y no usa herbicidas."
          high: "Incorpora múltiples medidas de manejo y control de malezas y no usa herbicidas químicos."
      # water_availability
      irrigation_system:
        name: "Sistema de riego"
        scoring:
          low: "No tiene sistema de riego."
          medium: "Tiene riego, por canales y/o vertientes, sin sistemas tecnificados."
          high: "Tiene riego, por canales y/o vertientes y también sistema tecnificado."
      deep_well_water:
        name: "Existencia de agua desde pozo profundo"
        scoring:
          low: "No cuenta con pozo profundos."
          medium: "Dispone de agua por extracción desde pozo profundo, pero no en cantidad suficiente."
          high: "Dispone de suficiente agua por extracción desde pozo profundo."
      water_quantity:
        name: "Cantidad de agua"
        scoring:
          low: "La cantidad de agua es muy escasa y es un factor limitante de la producción."
          medium: "La cantidad de agua no alcanza y es imposible regar a intervalos normales."
          high: "La cantidad de agua permite riegos con un régimen de intervalos normales."
      # crop_diversity
      crop_diversity:
        name: "Diversidad de cultivos"
        scoring:
          low: "Escasa diversidad de cultivos y frutales."
          medium: "Diversidad intermedia de cultivos y frutales."
          high: "Amplia diversidad de cultivos y frutales."
      crop_variety:
        name: "Variedad de cultivos"
        scoring:
          low: "Solo tiene una variedad en cada cultivo o frutal."
          medium: "Tiene 2 o 3 variedades de cultivos o frutales."
          high: "Cuenta con muchas variedades de cultivos o frutales diferentes."
      polycultures:
        name: "Policultivos (cultivos asociados o intercalados)"
        scoring:
          low: "Cultivos sin asociaciones."
          medium: "Cultivos intercalados o asociados en mediana cantidad."
          high: "Cultivos intercalados y asociados en alta cantidad."
      seed_origin:
        name: "Origen de las semillas"
        scoring:
          low: "Tiene muy pocas o ninguna semilla que la reproduzca, intercambia y use en el predio. Solo compra."
          medium: "Tiene semilla que la reproduce, intercambia y usa en el predio pero también depende de la compra."
          high: "Guarda, produce e intercambia muchas semillas en el predio, casi no depende de semillas externas."
      traditional_crops_seeds:
        name: "Semillas de cultivos tradicionales de importancia global"
        scoring:
          low: "No tiene y no conserva semillas de cultivos tradicionales de importancia global propios del territorio."
          medium: "Produce y guarda una cantidad intermedia de semillas de cultivos tradicionales de importancia global propias del territorio."
          high: "Produce, guarda e intercambia muchas semillas de cultivos tradicionales de importancia global propias del territorio."
      local_seed_banks:
        name: "Existencia de bancos de semillas locales u organizaciones de guardadoras de biodiversidad"
        scoring:
          low: "No existen bancos de semillas locales y no participa en organizaciones o grupos de guardadores de semillas."
          medium: "Existen grupos de guardadoras de semilla y participa esporádicamente."
          high: "Existen bancos de semillas locales y participa frecuentemente en actividades de intercambio y en espacios de guardadoras de semillas."
      # ecosystem_diversity
      live_barriers:
        name: "Barreras vivas"
        scoring:
          low: "No cuenta con barreras vivas."
          medium: "Menos de un 30 % de cultivos, praderas, frutales, terrazas, etc. separados con barreras vivas."
          high: "Entre un 80 y 100% de cultivos, praderas, frutales o terrazas, etc. separados con barreras vivas."
      live_coverage:
        name: "Asociación con cobertura viva"
        scoring:
          low: "Frutales sin cobertura viva."
          medium: "Tiene entre 20 y 50 % de frutales con cobertura vivas."
          high: "Tiene sobre 80 % de frutales con cobertura viva."
      live_fences:
        name: "Cercos vivos"
        scoring:
          low: "No cuenta con cercos vivos en el predio."
          medium: "Cuenta con un 25% de cercos vivos dentro de las posibilidades del predio."
          high: "Cuenta con 80 a 100% de cercos vivos en función de las posibilidades del predio."
      forest_patches:
        name: "Arboleda o parches de bosque"
        scoring:
          low: "El predio no tiene arboledas ni parches de bosque."
          medium: "Cuenta con arboledas y parches boscosos en el predio en mediana cantidad."
          high: "Cuenta con arboledas y parches boscosos en el predio, en cantidad suficiente para el buen funcionamiento predial."
      spontaneous_vegetation:
        name: "Sitios prediales de vegetación espontánea"
        scoring:
          low: "No cuenta con superficie del predio con vegetación silvestre o espontánea."
          medium: "Cuenta con superficie del predio con vegetación silvestre o espontánea en cantidad mediana."
          high: "Cuenta con superficie del predio con vegetación silvestre o espontánea."
      natural_enemies_diversity:
        name: "Diversidad de enemigos naturales de plagas"
        scoring:
          low: "No se observan enemigos naturales en los cultivos o frutales."
          medium: "Se observan algunos enemigos naturales comúnmente en los cultivos o frutales del predio."
          high: "Se observan abundante cantidad de enemigos naturales en los cultivos o frutales del predio."
      pollinator_diversity:
        name: "Diversidad de polinizadores"
        scoring:
          low: "No se observan especies polinizadoras."
          medium: "Se observan cantidad mediana de especies polinizadoras."
          high: "Se observa gran cantidad y variedad de polinizadores en el predio."
      entomophages_released:
        name: "Entomófagos liberados"
        scoring:
          low: "No se liberan especies de entomófagos."
          medium: "Se liberan especies de entomófagos."
          high: "Se liberan gran cantidad de especies de entomófagos."
      entomopathogen_applications:
        name: "Aplicaciones de entomopatógenos"
        scoring:
          low: "No se realiza aplicaciones de entomopatógenos."
          medium: "Aplicación esporádica de entomopatógenos."
          high: "Aplicación continua de entomopatógenos."
      # farm_planning
      transformation_conviction:
        name: "Convicción para iniciar un proceso de transformación"
        scoring:
          low: "Nivel de convicción básico que se encuentra en la fase de prueba y evaluación."
          medium: "Nivel de convicción intermedio, los avances dependerán del impacto de las prácticas implementadas."
          high: "Nivel de convicción elevado, no existe en su perspectiva más que esta posibilidad de producción."
      decision_for_practices:
        name: "Decisión para la incorporación de prácticas"
        scoring:
          low: "Incorporación de prácticas de baja complejidad y bajo riesgo."
          medium: "Incorporación de prácticas de un nivel medio de complejidad y de nivel medio de riesgo."
          high: "Incorporación de prácticas de alta complejidad y alto nivel de riesgo."
      experience_transmission:
        name: "Nivel de acciones de transmisión de la experiencia propia"
        scoring:
          low: "No existen acciones de transmisión de la experiencia propia."
          medium: "Ocasionalmente realiza acciones de transmisión de la experiencia propia."
          high: "Permanentemente se realizan acciones de transmisión de la experiencia propia."
      # input_management
      biocides_use:
        name: "Elaboración y uso de biocidas para plagas y enfermedades"
        scoring:
          low: "No elabora ni usa biocidas."
          medium: "Ocasionalmente usa productos biocidas."
          high: "Siempre que es necesario usa productos biocidas."
      preventive_sanitary_measures:
        name: "Medidas sanitarias preventivas (trampas, plantas repelentes, semillas desinfectadas, etc.)"
        scoring:
          low: "No usa medidas preventivas."
          medium: "Ocasionalmente usa medidas preventivas."
          high: "Siempre incorpora medidas preventivas."
      infected_plants_removal:
        name: "Elimina residuos post cosecha o plantas infectadas del lugar de cultivo"
        scoring:
          low: "No usa elimina residuos post cosecha o plantas infectadas."
          medium: "Ocasionalmente elimina residuos post cosecha o plantas infectadas."
          high: "Siempre elimina residuos post cosecha o plantas infectadas."
      sanitary_crop_rotation:
        name: "Realiza rotaciones de cultivos de manera ordenada y permanente"
        scoring:
          low: "No realiza rotaciones de cultivos."
          medium: "Ocasionalmente realiza rotaciones de cultivos."
          high: "Siempre realiza rotaciones de cultivos."
      inputs_produced:
        name: "Tipo de insumos que produce"
        scoring:
          low: "No produce insumos."
          medium: "Produce entre 1 y 3 insumos para el manejo de la fertilidad."
          high: "Produce más de tres insumos para el manejo de la fertilidad y el control de plagas y enfermedades."
      input_production_percentage:
        name: "Porcentaje de insumos preparados del total requerido"
        scoring:
          low: "Pocos insumos producidos del total requerido. Hasta un 20 %."
          medium: "Se produce entre un 30 y 70% del total de los insumos requeridos."
          high: "Más del 70% del total de los insumos requeridos."
      # animal_management
      animal_feed_conservation:
        name: "Conservación de alimentos para animales"
        scoring:
          low: "No tiene alimentos almacenados para los animales."
          medium: "Almacena alimentos para animales pero no suficientes."
          high: "Almacena la cantidad necesaria de alimentos para los animales."
      animal_feed_production_percentage:
        name: "% de la alimentación animal proveniente del propio campo"
        scoring:
          low: "10 a 30 %."
          medium: "40 a 70%."
          high: "80 a 100%."
      animal_feed_production:
        name: "Produce alimentos para todas las especies animales"
        scoring:
          low: "Para el 10% de las especies animales."
          medium: "Para el 50% de las especies."
          high: "Para el 100% de las especies."
      # economic_viability
      agricultural_commercialized_products:
        name: "Diversidad de productos agrícolas comercializados"
        scoring:
          low: "Comercializa pocos productos agrícolas. Entre 1 y 4."
          medium: "Comercializa entre 5 y 15 productos agrícolas distintos."
          high: "Comercializa más de 15 productos agrícolas."
      animal_commercialized_products:
        name: "Diversidad de productos de origen animal comercializados"
        scoring:
          low: "No comercializa o comercializa 1 producto."
          medium: "Comercializa entre 2 y 3 productos de origen animal."
          high: "Comercializa más de 3 productos de origen animal."
      territorial_commercialization:
        name: "Productos comercializados a nivel territorial"
        scoring:
          low: "Productos comercializado a nivel local."
          medium: "Productos comercializados a nivel comunal."
          high: "Productos comercializados a nivel provincial."
      production_destination:
        name: "Destino de la producción"
        scoring:
          low: "Producción de autoconsumo, ventas menores de excedentes."
          medium: "Producción de autoconsumo y venta de forma equilibrada."
          high: "Producción de autoconsumo y un volumen importante de venta."
      income:
        name: "Nivel de ingresos"
        scoring:
          low: "Bajo."
          medium: "Medio."
          high: "Alto."
      income_sources_diversity:
        name: "Número de rubros de donde provienen los ingresos"
        scoring:
          low: "Un rubro."
          medium: "2 a 3 rubros."
          high: "Más de tres rubros."
      # social_wellbeing
      agroecological_farmers_knowledge:
        name: "Conocimiento de los agricultores de prácticas agroecológicas"
        scoring:
          low: "No tiene conocimientos previos de agroecología, ni de fuentes tradicionales de producción."
          medium: "Conoce y utiliza al menos 10 prácticas tradicionales y las relaciona con sistemas más sanos y ecológicos."
          high: "Conoce y utiliza más de 10 prácticas tradicionales en un contexto agroecológico y ha incorporado diferentes técnicas de producción que provienen de fuentes actuales."
      soil_practices_number:
        name: "Número de prácticas agroecológicas para el manejo ecológico de suelo"
        scoring:
          low: "Realiza menos de 2 prácticas agroecológicas, o no realiza prácticas agroecológicas para el manejo ecológico de suelo."
          medium: "Conoce y realiza entre 2 y 6 prácticas agroecológicas para el manejo ecológico de suelo."
          high: "Conoce y realiza más de 6 prácticas agroecológicas para el manejo ecológico de suelo."
      disease_practices_number:
        name: "Número de prácticas agroecológicas para el manejo preventivo de plagas y enfermedades"
        scoring:
          low: "Realiza 1 práctica agroecológica, o no realiza prácticas agroecológicas para el manejo ecológico preventivo de plagas y enfermedades."
          medium: "Conoce y realiza entre 3 y 6 prácticas para el manejo ecológico preventivo de plagas y enfermedades."
          high: "Conoce y realiza más de 6 prácticas agroecológicas para el manejo ecológico preventivo de plagas y enfermedades."
      recycling_practices_number:
        name: "Número de prácticas de reciclaje"
        scoring:
          low: "No realiza prácticas de reciclaje."
          medium: "Conoce y realiza al menos 7 prácticas agroecológicas de reciclaje."
          high: "Conoce y realiza más de 7 prácticas agroecológicas de reciclaje."
      agroecological_organizations:
        name: "Conocimiento y participación en organizaciones asociadas a la producción agroecológica"
        scoring:
          low: "No tiene conocimientos ni participa de ninguna organización de esta naturaleza."
          medium: "Conoce la existencia de organizaciones de esta naturaleza, y ha participado esporádicamente."
          high: "Conoce y participa activamente en organizaciones de esta naturaleza."
      participation_conviction:
        name: "Nivel de convicción para participar en organizaciones vinculadas a la agroecología"
        scoring:
          low: "Nivel de convicción bajo o no le interesa participar."
          medium: "Nivel de convicción intermedio, y podrías participar a medida que va probando y viendo el funcionamiento."
          high: "Nivel de convicción elevado, participa activamente de las organizaciones."
      territorial_participation:
        name: "Participación a nivel comunal, regional y nacional"
        scoring:
          low: "No participa o participa ocasionalmente a nivel comunal."
          medium: "Participa a nivel comunal y ocasionalmente a nivel regional."
          high: "Participa en todos los niveles."
      family_food_availability:
        name: "Alimentos disponibles para la familia"
        scoring:
          low: "Pocos alimentos producidos en el predio."
          medium: "Entre un 25y 75% de los alimentos los produce en el predio."
          high: "Más del 75% de los alimentos los produce en su predio."
      food_conservation:
        name: "El nivel de producción permite conservar alimentos"
        scoring:
